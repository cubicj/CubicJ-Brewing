name: Attest Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attest
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-$EVENT_TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p release-assets
          for attempt in 1 2 3 4 5 6; do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern main.js --pattern styles.css --dir release-assets --clobber; then
              [ -f release-assets/main.js ] && [ -f release-assets/styles.css ] && exit 0
            fi
            echo "assets not ready (attempt $attempt), retrying in 20s"
            sleep 20
          done
          echo "::error::release assets main.js/styles.css not found on $TAG"
          exit 1
      - name: Verify build matches release assets
        run: |
          status=0
          for f in main.js styles.css; do
            built=$(sha256sum "build/$f" | cut -d' ' -f1)
            released=$(sha256sum "release-assets/$f" | cut -d' ' -f1)
            if [ "$built" != "$released" ]; then
              echo "::error::$f digest mismatch: built=$built released=$released"
              status=1
            fi
          done
          exit "$status"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-assets/main.js
            release-assets/styles.css
