name: PR Source Guard

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  dev-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "Pull requests to main are allowed only from dev (got: $HEAD_REF)"
            exit 1
          fi
